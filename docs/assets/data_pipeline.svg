<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="seqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6366f1" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981" />
    </marker>
    <marker id="arrRose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" fill="#f8fafc" font-size="18" font-weight="bold">TaskPulse End-to-End Data Pipeline & Failover Flow</text>
  <text x="40" y="66" fill="#94a3b8" font-size="12">Optimistic local-first writes with seamless PostgreSQL synchronization and offline resilience</text>

  <!-- Lifeline Columns -->
  <!-- 1. UI -->
  <rect x="50" y="90" width="150" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="125" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TaskPulse UI</text>
  <line x1="125" y1="130" x2="125" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 2. dbAdapter.js -->
  <rect x="250" y="90" width="160" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="330" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">src/lib/dbAdapter.js</text>
  <line x1="330" y1="130" x2="330" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 3. LocalStorage -->
  <rect x="460" y="90" width="160" height="40" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="540" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Browser LocalStorage</text>
  <line x1="540" y1="130" x2="540" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 4. Next.js API -->
  <rect x="670" y="90" width="140" height="40" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="740" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">/api/db/* Route</text>
  <line x1="740" y1="130" x2="740" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 5. NeonDB -->
  <rect x="830" y="90" width="100" height="40" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="880" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">NeonDB</text>
  <line x1="880" y1="130" x2="880" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Step 1 -->
  <path d="M 125 160 L 325 160" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)" />
  <text x="225" y="152" fill="#cbd5e1" font-size="11" text-anchor="middle">1. User creates task / note / routine</text>

  <!-- Step 2 -->
  <path d="M 330 190 L 535 190" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <text x="435" y="182" fill="#86efac" font-size="11" text-anchor="middle">2. Instant optimistic local write</text>

  <!-- Step 3 -->
  <path d="M 330 230 L 735 230" stroke="#a855f7" stroke-width="2" marker-end="url(#arr)" />
  <text x="535" y="222" fill="#d8b4fe" font-size="11" text-anchor="middle">3. POST /api/db/tasks payload</text>

  <!-- Step 4 -->
  <path d="M 740 270 L 875 270" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <text x="810" y="262" fill="#86efac" font-size="11" text-anchor="middle">4. SQL UPSERT</text>

  <!-- Step 5: Success Path -->
  <rect x="80" y="300" width="820" height="60" rx="8" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" stroke-dasharray="4 2" />
  <text x="95" y="320" fill="#34d399" font-size="11" font-weight="bold">[PATH A: CLOUD SUCCESS]</text>
  <path d="M 880 340 L 130 340" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrGreen)" />
  <text x="500" y="335" fill="#a7f3d0" font-size="11" text-anchor="middle">Status 200 OK -> UI Badge: "NeonDB Synced ●"</text>

  <!-- Step 6: Failover Path -->
  <rect x="80" y="375" width="820" height="60" rx="8" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 2" />
  <text x="95" y="395" fill="#fb7185" font-size="11" font-weight="bold">[PATH B: OFFLINE / TIMEOUT FAILOVER]</text>
  <path d="M 740 415 L 130 415" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrRose)" />
  <text x="435" y="410" fill="#fecdd3" font-size="11" text-anchor="middle">Network error / offline -> UI Badge: "Offline Cache Active (Zero Data Loss) ⚡"</text>
</svg>
